name: AppKit oracle
on: push
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the clang bindings
        run: python3 -m pip install --break-system-packages libclang
      - name: Extract the AppKit API from the SDK headers
        run: |
          xcrun --show-sdk-path
          xcrun --show-sdk-version
          clang --version
          python3 Tests/apiextract/apiextract_driver.py reference-apple.json
          wc -c reference-apple.json
      - uses: actions/upload-artifact@v4
        with:
          name: reference-apple
          path: reference-apple.json
