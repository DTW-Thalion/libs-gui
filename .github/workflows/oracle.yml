name: AppKit oracle
on: push
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show the AppKit NSBrowser delegate declarations
        run: |
          SDK=$(xcrun --show-sdk-path)
          sed -n '/@protocol NSBrowserDelegate/,/^@end/p' \
            "$SDK/System/Library/Frameworks/AppKit.framework/Headers/NSBrowser.h"
