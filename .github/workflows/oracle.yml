name: AppKit oracle
on: push
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the public Foundation API from the SDK headers
        run: |
          set -x
          SDK=$(xcrun --show-sdk-path)
          FW="$SDK/System/Library/Frameworks/Foundation.framework/Headers"
          ls "$FW" | head -5
          ls "$FW"/*.h | wc -l
          python3 -m pip install --quiet --break-system-packages libclang
          cd Tests/apiextract
          python3 run_extract.py "$SDK" "$FW" "$GITHUB_WORKSPACE/reference-apple.json"
          wc -c "$GITHUB_WORKSPACE/reference-apple.json"
      - name: Upload the extracted reference
        uses: actions/upload-artifact@v4
        with:
          name: reference-apple
          path: reference-apple.json
